<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arslan Ki YouTube</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#0f0f0f;
color:#fff;
}

header{
height:65px;
background:#181818;
display:flex;
align-items:center;
gap:18px;
padding:0 20px;
position:sticky;
top:0;
z-index:100;
border-bottom:1px solid #292929;
}

.logo{
font-size:23px;
font-weight:bold;
color:#ff3030;
cursor:pointer;
white-space:nowrap;
}

.search{
flex:1;
max-width:650px;
padding:12px 20px;
border-radius:25px;
border:1px solid #444;
background:#242424;
color:#fff;
outline:none;
font-size:15px;
}

.admin-btn{
background:#272727;
color:#fff;
border:0;
padding:10px 18px;
border-radius:20px;
cursor:pointer;
}

nav{
display:flex;
gap:10px;
padding:12px 20px;
background:#151515;
border-bottom:1px solid #292929;
overflow-x:auto;
}

nav button{
border:0;
background:#292929;
color:#fff;
padding:10px 18px;
border-radius:20px;
cursor:pointer;
white-space:nowrap;
}

nav button:hover{
background:#3a3a3a;
}

.container{
max-width:1400px;
margin:auto;
padding:20px;
}

.hero{
padding:40px;
border-radius:18px;
background:linear-gradient(135deg,#292929,#151515);
margin-bottom:30px;
}

.hero h1{
font-size:36px;
margin:0 0 10px;
}

.hero p{
color:#aaa;
}

.grid{
display:grid;
grid-template-columns:
repeat(auto-fill,minmax(250px,1fr));
gap:20px;
}

.card{
background:#181818;
border-radius:12px;
overflow:hidden;
cursor:pointer;
transition:.2s;
}

.card:hover{
transform:translateY(-4px);
background:#222;
}

.thumbnail{
height:155px;
background:linear-gradient(135deg,#292929,#171717);
display:flex;
align-items:center;
justify-content:center;
font-size:50px;
position:relative;
}

.play{
width:55px;
height:55px;
border-radius:50%;
background:#ff3030;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
}

.info{
padding:14px;
}

.info h3{
margin:0 0 8px;
font-size:17px;
}

.muted{
color:#999;
font-size:13px;
}

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.88);
display:flex;
align-items:center;
justify-content:center;
padding:20px;
z-index:1000;
}

.hidden{
display:none;
}

.box{
width:100%;
max-width:900px;
max-height:92vh;
overflow:auto;
background:#1b1b1b;
border:1px solid #444;
border-radius:16px;
padding:22px;
}

.box input,
.box select{
width:100%;
padding:13px;
margin:7px 0;
background:#101010;
color:#fff;
border:1px solid #444;
border-radius:8px;
outline:none;
}

.box textarea{
width:100%;
height:100px;
padding:13px;
margin:7px 0;
background:#101010;
color:#fff;
border:1px solid #444;
border-radius:8px;
resize:vertical;
}

.btn{
padding:11px 17px;
border:0;
border-radius:8px;
cursor:pointer;
font-weight:bold;
margin:5px;
}

.red{
background:#ff3030;
color:#fff;
}

.green{
background:#16803c;
color:#fff;
}

.gray{
background:#444;
color:#fff;
}

.danger{
background:#c62828;
color:#fff;
}

.row{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:10px;
}

.admin-card{
background:#292929;
padding:15px;
border-radius:10px;
margin:10px 0;
}

hr{
border:0;
border-top:1px solid #333;
margin:25px 0;
}

.empty{
padding:30px;
text-align:center;
color:#999;
}

.video-player{
width:100%;
max-height:70vh;
background:#000;
display:block;
}

@media(max-width:600px){

header{
height:60px;
padding:0 10px;
gap:8px;
}

.logo{
font-size:17px;
}

.search{
min-width:80px;
font-size:13px;
}

.admin-btn{
padding:9px 12px;
}

.container{
padding:12px;
}

.hero{
padding:25px 20px;
}

.hero h1{
font-size:27px;
}

.grid{
grid-template-columns:1fr;
}

.thumbnail{
height:190px;
}

}
</style>
</head>

<body>

<header>

<div
class="logo"
onclick="openAdminLogin()"
>
▶ Arslan Ki YouTube
</div>

<input
id="search"
class="search"
placeholder="Search videos..."
oninput="renderVideos()"
>

<button
class="admin-btn"
onclick="openAdminLogin()"
>
Admin
</button>

</header>


<nav>

<button onclick="changeCategory('All')">
Home
</button>

<button onclick="changeCategory('Series')">
Series
</button>

<button onclick="changeCategory('Movies')">
Movies
</button>

<button onclick="changeCategory('Shorts')">
Shorts
</button>

</nav>


<main class="container">

<section class="hero">

<h1>
Welcome to Arslan Ki YouTube
</h1>

<p>
Watch public videos, series, movies and shorts.
</p>

<p class="muted">
🎬 सभी videos public हैं।
</p>

</section>


<h2 id="sectionTitle">
Latest Videos
</h2>


<div
id="videoGrid"
class="grid">
</div>

</main>


<div
id="modal"
class="modal hidden">
</div>


<script>

/* =========================================
   DATABASE
========================================= */

const DATABASE_KEY="ARSLAN_YOUTUBE_DATABASE";

let database=
JSON.parse(
localStorage.getItem(DATABASE_KEY)
)||{

videos:[

{
id:"video_1",
title:"Welcome To Arslan Ki YouTube",
category:"Series",
description:"Welcome to Arslan Ki YouTube.",
url:""
}

]

};


let currentCategory="All";


/* =========================================
   SAVE DATABASE
========================================= */

function saveDatabase(){

localStorage.setItem(
DATABASE_KEY,
JSON.stringify(database)
);

}


/* =========================================
   SAFE TEXT
========================================= */

function safe(text){

return String(text||"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =========================================
   CATEGORY
========================================= */

function changeCategory(category){

currentCategory=category;

renderVideos();

}


/* =========================================
   SHOW VIDEOS
========================================= */

function renderVideos(){

const search=
document
.getElementById("search")
.value
.toLowerCase();


let videos=
database.videos.filter(video=>{

const categoryMatch=
currentCategory==="All"
||
video.category===currentCategory;

const searchMatch=
video.title
.toLowerCase()
.includes(search);

return categoryMatch &&
searchMatch;

});


document.getElementById(
"sectionTitle"
).innerText=
currentCategory==="All"
?"Latest Videos"
:currentCategory;


let html="";


videos.forEach(video=>{

html+=`

<div
class="card"
onclick="watchVideo('${video.id}')"
>

<div class="thumbnail">

<div class="play">
▶
</div>

</div>

<div class="info">

<h3>
${safe(video.title)}
</h3>

<p class="muted">
${safe(video.category)}
</p>

<p class="muted">
Public • Watch Now
</p>

</div>

</div>

`;

});


if(!html){

html=`

<div class="empty">

<h3>
No videos found
</h3>

<p>
Search another video.
</p>

</div>

`;

}


document.getElementById(
"videoGrid"
).innerHTML=html;

}


/* =========================================
   WATCH PUBLIC VIDEO
========================================= */

function watchVideo(id){

const video=
database.videos.find(
v=>v.id===id
);


if(!video)return;


let player="";


if(video.url){

player=`

<video
class="video-player"
controls
playsinline
preload="metadata"
>

<source
src="${safe(video.url)}"
type="video/mp4"
>

Your browser does not support video.

</video>

`;

}else{

player=`

<div
style="
background:#000;
padding:100px 20px;
text-align:center;
"
>

<h2>
🎬 Video Ready
</h2>

<p>
Admin ने अभी video URL नहीं डाला है।
</p>

</div>

`;

}


openModal(`

<div class="box">

<h2>
${safe(video.title)}
</h2>

${player}

<p>
${safe(video.description)}
</p>

<button
class="btn gray"
onclick="closeModal()"
>
Close
</button>

</div>

`);

}


/* =========================================
   ADMIN LOGIN
========================================= */

function openAdminLogin(){

openModal(`

<div class="box">

<h2>
👑 Admin Login
</h2>

<p class="muted">
केवल website owner के लिए।
</p>

<input
id="adminPassword"
type="password"
placeholder="Admin Password"
>

<div class="row">

<button
class="btn red"
onclick="checkAdmin()"
>
Login
</button>

<button
class="btn gray"
onclick="closeModal()"
>
Cancel
</button>

</div>

</div>

`);

}


function checkAdmin(){

const password=
document.getElementById(
"adminPassword"
).value;


if(password!=="admin123"){

alert(
"Wrong Admin Password"
);

return;

}


adminPanel();

}


/* =========================================
   ADMIN PANEL
========================================= */

function adminPanel(){

let videosHTML="";


database.videos.forEach(video=>{

videosHTML+=`

<div class="admin-card">

<h3>
${safe(video.title)}
</h3>

<p class="muted">
Category:
${safe(video.category)}
</p>

<p class="muted">
${
video.url
?
"✅ Video URL Added"
:
"⚠️ Video URL Not Added"
}
</p>

<div class="row">

<button
class="btn danger"
onclick="deleteVideo('${video.id}')"
>
Delete
</button>

</div>

</div>

`;

});


openModal(`

<div class="box">

<h2>
👑 Arslan Ki YouTube - Admin
</h2>

<hr>


<h3>
➕ Add Public Video
</h3>


<input
id="videoTitle"
placeholder="Video / Series title"
>


<select id="videoCategory">

<option value="Series">
Series
</option>

<option value="Movies">
Movies
</option>

<option value="Shorts">
Shorts
</option>

</select>


<input
id="videoURL"
placeholder="Direct MP4 video URL"
>


<textarea
id="videoDescription"
placeholder="Video description"
></textarea>


<button
class="btn green"
onclick="addVideo()"
>
Add Public Video
</button>


<hr>


<h3>
📺 All Videos
</h3>


${videosHTML}


<hr>


<button
class="btn gray"
onclick="closeModal()"
>
Close Admin
</button>


</div>

`);

}


/* =========================================
   ADD VIDEO
========================================= */

function addVideo(){

const title=
document
.getElementById("videoTitle")
.value
.trim();


const category=
document
.getElementById("videoCategory")
.value;


const url=
document
.getElementById("videoURL")
.value
.trim();


const description=
document
.getElementById("videoDescription")
.value
.trim();


if(!title){

alert(
"Video title डालें"
);

return;

}


const newVideo={

id:
"video_"+Date.now(),

title:title,

category:category,

url:url,

description:description

};


database.videos.push(
newVideo
);


saveDatabase();


alert(
"Video successfully added!"
);


adminPanel();


renderVideos();

}


/* =========================================
   DELETE VIDEO
========================================= */

function deleteVideo(id){

if(
!confirm(
"क्या आप इस video को delete करना चाहते हैं?"
)
){

return;

}


database.videos=
database.videos.filter(
video=>video.id!==id
);


saveDatabase();


adminPanel();


renderVideos();

}


/* =========================================
   MODAL
========================================= */

function openModal(content){

const modal=
document.getElementById("modal");

modal.innerHTML=content;

modal.classList.remove(
"hidden"
);

}


function closeModal(){

const modal=
document.getElementById("modal");

modal.classList.add(
"hidden"
);

modal.innerHTML="";

}


/* =========================================
   ESC KEY
========================================= */

document.addEventListener(
"keydown",
function(event){

if(event.key==="Escape"){

closeModal();

}

});


/* =========================================
   START WEBSITE
========================================= */

renderVideos();

</script>

</body>
</html>
