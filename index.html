<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arslan Ki YouTube - Admin</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#08080c;
  color:white;
}

header{
  background:#15151b;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #292932;
}

.logo{
  font-size:21px;
  font-weight:bold;
}

.admin{
  background:#ff3030;
  padding:9px 14px;
  border-radius:10px;
  font-weight:bold;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.welcome{
  background:#15151b;
  border:1px solid #292932;
  border-radius:18px;
  padding:25px;
  margin-bottom:20px;
}

.welcome h1{
  margin-top:0;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.box{
  background:#1b1b22;
  border:1px solid #292932;
  border-radius:16px;
  padding:20px;
}

.number{
  font-size:30px;
  font-weight:bold;
  margin-top:8px;
}

.controls{
  margin-top:20px;
  display:grid;
  gap:12px;
}

button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  color:white;
  background:#ff3030;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.secondary{
  background:#303038;
}

.notice{
  color:#ffc857;
  line-height:1.5;
  font-size:14px;
}

@media(max-width:600px){
  .grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    👑 Arslan Ki YouTube
  </div>

  <div class="admin">
    ADMIN
  </div>

</header>


<div class="container">

  <div class="welcome">

    <h1>Welcome Admin 👋</h1>

    <p>
      आपका Admin Dashboard तैयार है।
    </p>

    <p class="notice">
      इस version में Firebase email/password login नहीं है।
      यह standalone dashboard है।
    </p>

  </div>


  <div class="grid">

    <div class="box">
      📺 Videos
      <div class="number" id="videos">0</div>
    </div>

    <div class="box">
      🎞️ Series
      <div class="number" id="series">0</div>
    </div>

    <div class="box">
      🎬 Movies
      <div class="number" id="movies">0</div>
    </div>

    <div class="box">
      ▶️ Shorts
      <div class="number" id="shorts">0</div>
    </div>

  </div>


  <div class="welcome">

    <h2>⚙️ Admin Controls</h2>

    <div class="controls">

      <button onclick="addVideo()">
        ➕ Add Video
      </button>

      <button onclick="manageSeries()" class="secondary">
        📺 Manage Series
      </button>

      <button onclick="manageMovies()" class="secondary">
        🎬 Manage Movies
      </button>

      <button onclick="manageShorts()" class="secondary">
        ▶️ Manage Shorts
      </button>

      <button onclick="goHome()" class="secondary">
        🏠 Back to Website
      </button>

    </div>

  </div>

</div>


<script>

function addVideo(){

  alert("Add Video section खुल गया।");

}


function manageSeries(){

  alert("Series Management खुल गया।");

}


function manageMovies(){

  alert("Movies Management खुल गया।");

}


function manageShorts(){

  alert("Shorts Management खुल गया।");

}


function goHome(){

  window.location.href="index.html";

}

</script>

</body>
</html>
