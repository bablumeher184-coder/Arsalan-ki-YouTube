<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arslan Ki YouTube</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#0f0f0f;
color:#fff;
}

header{
height:65px;
background:#181818;
display:flex;
align-items:center;
gap:15px;
padding:0 18px;
position:sticky;
top:0;
z-index:50;
}

.logo{
font-size:20px;
font-weight:bold;
color:#ff3030;
white-space:nowrap;
}

.search{
flex:1;
max-width:650px;
padding:12px 18px;
border-radius:25px;
border:1px solid #444;
background:#242424;
color:#fff;
outline:none;
}

.adminBtn{
background:#ff3030;
color:#fff;
border:0;
padding:10px 17px;
border-radius:20px;
font-weight:bold;
cursor:pointer;
}

nav{
display:flex;
gap:10px;
padding:12px 18px;
background:#151515;
overflow-x:auto;
}

nav button{
border:0;
background:#292929;
color:#fff;
padding:10px 18px;
border-radius:20px;
cursor:pointer;
white-space:nowrap;
}

nav button.active{
background:#fff;
color:#111;
}

.container{
max-width:1400px;
margin:auto;
padding:20px;
}

.hero{
padding:38px;
border-radius:18px;
background:linear-gradient(135deg,#292929,#151515);
margin-bottom:28px;
}

.hero h1{
font-size:35px;
margin:0 0 10px;
}

.grid{
display:grid;
grid-template-columns:
repeat(auto-fill,minmax(250px,1fr));
gap:20px;
}

.card{
background:#181818;
border-radius:12px;
overflow:hidden;
cursor:pointer;
transition:.2s;
}

.card:hover{
transform:translateY(-4px);
background:#222;
}

.thumb{
height:155px;
background:#292929;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

.thumb img{
width:100%;
height:100%;
object-fit:cover;
}

.play{
width:55px;
height:55px;
border-radius:50%;
background:#ff3030;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
}

.info{
padding:14px;
}

.info h3{
margin:0 0 8px;
}

.muted{
color:#999;
font-size:13px;
}

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.9);
display:flex;
align-items:center;
justify-content:center;
padding:15px;
z-index:1000;
}

.hidden{
display:none;
}

.box{
width:100%;
max-width:900px;
max-height:92vh;
overflow:auto;
background:#1c1c1c;
border:1px solid #444;
border-radius:16px;
padding:22px;
}

.box input,
.box select,
.box textarea{
width:100%;
padding:13px;
margin:7px 0;
background:#101010;
color:#fff;
border:1px solid #444;
border-radius:8px;
outline:none;
}

.box textarea{
height:100px;
resize:vertical;
}

.row{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:10px;
}

.btn{
border:0;
padding:11px 17px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.red{
background:#ff3030;
color:#fff;
}

.green{
background:#159447;
color:#fff;
}

.gray{
background:#444;
color:#fff;
}

.danger{
background:#c62828;
color:#fff;
}

.video{
width:100%;
max-height:70vh;
background:#000;
display:block;
}

.download{
display:inline-block;
background:#159447;
color:#fff;
padding:11px 16px;
border-radius:8px;
text-decoration:none;
font-weight:bold;
}

.adminVideo{
background:#292929;
border-radius:10px;
padding:14px;
margin:10px 0;
}

.adminVideo img{
width:180px;
max-width:100%;
border-radius:8px;
}

.empty{
padding:40px;
text-align:center;
color:#999;
}

hr{
border:0;
border-top:1px solid #333;
margin:25px 0;
}

.status{
padding:12px;
border-radius:8px;
background:#252525;
color:#aaa;
margin-bottom:12px;
}

@media(max-width:650px){

header{
height:60px;
padding:0 8px;
gap:8px;
}

.logo{
font-size:16px;
}

.search{
min-width:70px;
font-size:12px;
}

.adminBtn{
padding:9px 12px;
font-size:12px;
}

.container{
padding:12px;
}

.hero{
padding:25px 18px;
}

.hero h1{
font-size:27px;
}

.grid{
grid-template-columns:1fr;
}

.thumb{
height:190px;
}

}
</style>
</head>

<body>

<header>

<div class="logo">
▶ Arslan Ki YouTube
</div>

<input
id="search"
class="search"
placeholder="Search videos..."
>

<button
class="adminBtn"
onclick="openAdmin()">
Admin
</button>

</header>


<nav>

<button
id="allBtn"
class="active"
onclick="setCategory('All')">
Home
</button>

<button
id="seriesBtn"
onclick="setCategory('Series')">
Series
</button>

<button
id="moviesBtn"
onclick="setCategory('Movies')">
Movies
</button>

<button
id="shortsBtn"
onclick="setCategory('Shorts')">
Shorts
</button>

</nav>


<main class="container">

<section class="hero">

<h1>
Welcome to Arslan Ki YouTube
</h1>

<p>
Public videos, series, movies and shorts.
</p>

<p class="muted">
🎬 Public Video Library
</p>

</section>


<h2 id="heading">
Latest Videos
</h2>


<div
id="videoGrid"
class="grid">
</div>

</main>


<div
id="modal"
class="modal hidden">
</div>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
getAuth,
signInAnonymously
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
getFirestore,
collection,
addDoc,
getDocs,
getDoc,
updateDoc,
deleteDoc,
doc,
query,
orderBy,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig={

apiKey:
"AIzaSyCNfGSL9JmvrcydSniyIdz7ULiIsNYbbTo",

authDomain:
"kranti-1e28f.firebaseapp.com",

projectId:
"kranti-1e28f",

storageBucket:
"kranti-1e28f.firebasestorage.app",

messagingSenderId:
"407524375045",

appId:
"1:407524375045:web:d74b6335be39bc935d7a6c",

measurementId:
"G-HP3QFTLLBT"

};


/* =====================================================
   FIREBASE
===================================================== */

const app=
initializeApp(firebaseConfig);

const auth=
getAuth(app);

const db=
getFirestore(app);


/* =====================================================
   VARIABLES
===================================================== */

let currentUser=null;

let category="All";


/* =====================================================
   ANONYMOUS LOGIN
===================================================== */

try{

const result=
await signInAnonymously(auth);

currentUser=
result.user;

}catch(error){

console.error(error);

alert(
"Firebase Authentication में Anonymous Login Enable करें।"
);

}


/* =====================================================
   MODAL
===================================================== */

function showModal(html){

const modal=
document.getElementById("modal");

modal.innerHTML=html;

modal.classList.remove("hidden");

}


function closeModal(){

const modal=
document.getElementById("modal");

modal.classList.add("hidden");

modal.innerHTML="";

}

window.closeModal=closeModal;


/* =====================================================
   SAFE TEXT
===================================================== */

function safe(value){

return String(value||"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =====================================================
   CATEGORY
===================================================== */

window.setCategory=function(c){

category=c;

document
.querySelectorAll("nav button")
.forEach(btn=>{
btn.classList.remove("active");
});

if(c==="All")
document
.getElementById("allBtn")
.classList.add("active");

if(c==="Series")
document
.getElementById("seriesBtn")
.classList.add("active");

if(c==="Movies")
document
.getElementById("moviesBtn")
.classList.add("active");

if(c==="Shorts")
document
.getElementById("shortsBtn")
.classList.add("active");

loadVideos();

};


/* =====================================================
   ADMIN PANEL
===================================================== */

window.openAdmin=async function(){

if(!currentUser){

alert(
"Firebase अभी connected नहीं है।"
);

return;

}


await openAdminPanel();

};


async function openAdminPanel(){

const videos=
await getAllVideos();


let list="";


videos.forEach(v=>{

list+=`

<div class="adminVideo">

${
v.thumbnail
?
`<img src="${safe(v.thumbnail)}">`
:
""
}

<h3>
${safe(v.title)}
</h3>

<p class="muted">
${safe(v.category)}
${v.episode
?
" • Episode "+safe(v.episode)
:
""}
</p>

<div class="row">

<button
class="btn green"
onclick="editVideo('${v.id}')">
✏️ Edit
</button>

<button
class="btn danger"
onclick="deleteVideo('${v.id}')">
🗑️ Delete
</button>

</div>

</div>

`;

});


showModal(`

<div class="box">

<h2>
👑 Admin Panel
</h2>

<div class="status">
Firebase connected.
</div>


<h3>
➕ Add New Video
</h3>


<input
id="title"
placeholder="Video / Series Name"
>


<select id="videoCategory">

<option value="Series">
Series
</option>

<option value="Movies">
Movies
</option>

<option value="Shorts">
Shorts
</option>

<option value="Videos">
Videos
</option>

</select>


<input
id="episode"
placeholder="Episode Number (optional)"
>


<input
id="videoUrl"
placeholder="Video URL - MP4 / YouTube URL"
>


<input
id="thumbnail"
placeholder="Thumbnail Image URL"
>


<textarea
id="description"
placeholder="Video Description">
</textarea>


<button
class="btn green"
onclick="addVideo()">
💾 Add Video
</button>


<hr>


<h3>
📺 All Videos
</h3>


${list}


<hr>


<button
class="btn gray"
onclick="closeModal()">
Close Admin
</button>

</div>

`);

}


/* =====================================================
   GET VIDEOS
===================================================== */

async function getAllVideos(){

try{

const q=
query(
collection(db,"videos"),
orderBy("createdAt","desc")
);


const snapshot=
await getDocs(q);


let videos=[];


snapshot.forEach(item=>{

videos.push({

id:item.id,

...item.data()

});

});


return videos;

}catch(error){

console.error(error);

return [];

}

}


/* =====================================================
   ADD VIDEO
===================================================== */

window.addVideo=async function(){

const title=
document
.getElementById("title")
.value
.trim();


const videoCategory=
document
.getElementById("videoCategory")
.value;


const episode=
document
.getElementById("episode")
.value
.trim();


const videoUrl=
document
.getElementById("videoUrl")
.value
.trim();


const thumbnail=
document
.getElementById("thumbnail")
.value
.trim();


const description=
document
.getElementById("description")
.value
.trim();


if(!title){

alert(
"Video name डालें।"
);

return;

}


if(!videoUrl){

alert(
"Video URL डालें।"
);

return;

}


try{

await addDoc(
collection(db,"videos"),
{

title:title,

category:videoCategory,

episode:episode,

videoUrl:videoUrl,

thumbnail:thumbnail,

description:description,

public:true,

createdAt:
serverTimestamp(),

createdBy:
currentUser.uid

}
);


alert(
"✅ Video successfully added!"
);


await loadVideos();

openAdminPanel();


}catch(error){

console.error(error);

alert(
"Save error: "+
error.message
);

}

};


/* =====================================================
   EDIT VIDEO
===================================================== */

window.editVideo=async function(id){

const videos=
await getAllVideos();

const video=
videos.find(v=>v.id===id);


if(!video){

alert("Video नहीं मिला।");

return;

}


const title=
prompt(
"Video Title:",
video.title||""
);


if(title===null)
return;


const url=
prompt(
"Video URL:",
video.videoUrl||""
);


if(url===null)
return;


const description=
prompt(
"Description:",
video.description||""
);


if(description===null)
return;


try{

await updateDoc(
doc(db,"videos",id),
{

title:title,

videoUrl:url,

description:description,

updatedAt:
serverTimestamp()

}
);


alert(
"✅ Video updated!"
);


await loadVideos();

openAdminPanel();


}catch(error){

alert(
"Update error: "+
error.message
);

}

};


/* =====================================================
   DELETE VIDEO
===================================================== */

window.deleteVideo=
async function(id){

if(!confirm(
"क्या आप यह video delete करना चाहते हैं?"
)){

return;

}


try{

await deleteDoc(
doc(db,"videos",id)
);


alert(
"✅ Video deleted!"
);


await loadVideos();

openAdminPanel();


}catch(error){

alert(
"Delete error: "+
error.message
);

}

};


/* =====================================================
   LOAD PUBLIC VIDEOS
===================================================== */

async function loadVideos(){

const grid=
document
.getElementById("videoGrid");


grid.innerHTML=
"<p class='muted'>Loading...</p>";


const videos=
await getAllVideos();


const search=
document
.getElementById("search")
.value
.toLowerCase();


const filtered=
videos.filter(v=>{

return(

v.public!==false

&&

(
category==="All"
||
v.category===category
)

&&

(
(v.title||"")
.toLowerCase()
.includes(search)
)

);

});


if(!filtered.length){

grid.innerHTML=`

<div class="empty">

<h3>
No videos available
</h3>

<p>
Admin panel से पहला video add करें।
</p>

</div>

`;

return;

}


document
.getElementById("heading")
.innerText=
category==="All"
?
"Latest Videos"
:
category;


let html="";


filtered.forEach(v=>{

html+=`

<div
class="card"
onclick="watchVideo('${v.id}')">

<div class="thumb">

${
v.thumbnail
?
`<img src="${safe(v.thumbnail)}">`
:
`<div class="play">▶</div>`
}

</div>


<div class="info">

<h3>
${safe(v.title)}
</h3>

<p class="muted">

${safe(v.category)}

${v.episode
?
" • Episode "+
safe(v.episode)
:
""}

</p>

</div>

</div>

`;

});


grid.innerHTML=
html;

}


/* =====================================================
   WATCH
===================================================== */

window.watchVideo=
async function(id){

const videoDoc=
await getDoc(
doc(db,"videos",id)
);


if(!videoDoc.exists()){

alert(
"Video not found."
);

return;

}


const v=
videoDoc.data();


if(v.public===false){

alert(
"Video unavailable."
);

return;

}


let player="";


if(
(v.videoUrl||"")
.includes("youtube.com")
||
(v.videoUrl||"")
.includes("youtu.be")
){

let videoId="";


if(v.videoUrl.includes("youtu.be/")){

videoId=
v.videoUrl
.split("youtu.be/")[1]
.split("?")[0];

}else{

try{

videoId=
new URL(v.videoUrl)
.searchParams
.get("v");

}catch(e){}

}


if(videoId){

player=`

<iframe
width="100%"
height="500"
src="https://www.youtube.com/embed/${safe(videoId)}"
frameborder="0"
allowfullscreen>
</iframe>

`;

}

}else{

player=`

<video
class="video"
controls
playsinline>

<source
src="${safe(v.videoUrl)}">

</video>

`;

}


showModal(`

<div class="box">

<h2>
${safe(v.title)}
</h2>

${player}

<p>
${safe(v.description)}
</p>


${
v.videoUrl
?
`
<a
class="download"
href="${safe(v.videoUrl)}"
target="_blank"
rel="noopener">
⬇️ Open / Download
</a>
`
:
""
}


<button
class="btn gray"
onclick="closeModal()">
Close
</button>

</div>

`);

};


/* =====================================================
   SEARCH
===================================================== */

document
.getElementById("search")
.addEventListener(
"input",
loadVideos
);


/* =====================================================
   INITIAL LOAD
===================================================== */

loadVideos();

</script>

</body>
</html>
